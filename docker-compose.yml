version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: stockvault_postgres
    restart: always
    environment:
      POSTGRES_DB: stockvault_db
      POSTGRES_USER: stockvault_user
      POSTGRES_PASSWORD: secure_stockvault_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockvault_user -d stockvault_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: stockvault_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://stockvault_user:secure_stockvault_password@postgres:5432/stockvault_db?schema=public
      JWT_SECRET: super_secure_production_jwt_secret_stockvault_enterprise
      JWT_EXPIRY: 7d
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stockvault_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
